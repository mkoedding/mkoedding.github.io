<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zahlengerade einstellen</title>
<style>
:root{
  --bg:#e9edf2;
  --papier:#ffffff;
  --tinte:#14213d;
  --tinte-hell:#5a6b85;
  --linie:#c3ccd8;
  --minus:#2f6f8f;
  --plus:#a2600d;
  --falsch:#b3261e;
  --schrift: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--tinte);
  font-family:var(--schrift);
  min-height:100vh;
  padding:clamp(12px,2vw,28px);
}
.eyebrow{
  font-size:clamp(11px,1vw,13px);
  font-weight:700;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--tinte-hell);
  margin:0 0 10px;
}
header{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:12px 20px;
  border-bottom:3px solid var(--tinte);
  padding-bottom:14px;
  margin-bottom:clamp(16px,2.5vw,30px);
}
h1{font-size:clamp(20px,2.6vw,32px);font-weight:800;letter-spacing:-.02em;margin:0}
.werkzeuge{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto;align-items:center}
.feld{display:flex;align-items:center;gap:6px}
label{font-size:clamp(13px,1.1vw,15px);font-weight:700}
button,input{
  font-family:inherit;
  font-size:clamp(14px,1.2vw,16px);
  font-weight:600;
  color:var(--tinte);
  background:var(--papier);
  border:2px solid var(--tinte);
  border-radius:8px;
  padding:8px 12px;
}
button{cursor:pointer}
button:hover{background:#dfe5ee}
button.stark{background:var(--tinte);color:#fff}
button.stark:hover{background:#25365a}
button:focus-visible,input:focus-visible{outline:3px solid var(--minus);outline-offset:2px}
input.zahl{width:88px;text-align:center;font-variant-numeric:tabular-nums}
.tafel{
  background:var(--papier);
  border:3px solid var(--tinte);
  border-radius:14px;
  padding:clamp(10px,1.6vw,20px);
}
.tafel svg{display:block;width:100%;height:auto;cursor:crosshair;touch-action:manipulation}
.fuss{
  display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;
  margin-top:14px;
}
.hinweis{font-size:clamp(13px,1.1vw,15px);color:var(--tinte-hell);margin:0}
.hinweis.fehler{color:var(--falsch);font-weight:700}
</style>
</head>
<body>

<header>
  <div>
    <p class="eyebrow">Tafelbild</p>
    <h1>Zahlengerade</h1>
  </div>
  <div class="werkzeuge">
    <div class="feld"><label for="a">von</label><input class="zahl" type="text" inputmode="numeric" id="a" value="-15"></div>
    <div class="feld"><label for="b">bis</label><input class="zahl" type="text" inputmode="numeric" id="b" value="10"></div>
    <button class="stark" id="zeichnen">Zeichnen</button>
    <button id="beschriftung">Zahlen ausblenden</button>
    <button id="leeren">Punkte löschen</button>
    <button id="vollbild">Vollbild</button>
  </div>
</header>

<div class="tafel">
  <div id="gerade"></div>
</div>

<div class="fuss">
  <div class="feld">
    <label for="punkt">Zahlpunkt setzen</label>
    <input class="zahl" type="text" inputmode="numeric" id="punkt" placeholder="-7">
    <button id="setzen">Eintragen</button>
  </div>
  <p class="hinweis" id="hinweis">Auf die Gerade tippen setzt einen Punkt. Nochmal tippen nimmt ihn weg.</p>
</div>

<script>
const zustand = {
  a: -10,
  b: 10,
  punkte: [],
  beschriftet: true,
  masse: null
};

const el = {
  a: document.getElementById("a"),
  b: document.getElementById("b"),
  gerade: document.getElementById("gerade"),
  hinweis: document.getElementById("hinweis"),
  punkt: document.getElementById("punkt"),
  beschriftung: document.getElementById("beschriftung")
};

function hinweis(text, art){
  el.hinweis.textContent = text;
  el.hinweis.className = "hinweis" + (art ? " " + art : "");
}

function standardHinweis(){
  hinweis("Auf die Gerade tippen setzt einen Punkt. Nochmal tippen nimmt ihn weg.", "");
}

function ganzeZahl(text){
  const t = String(text).replace(/\s|\u2212/g, "").replace(",", ".");
  if(!/^-?\d+$/.test(t)) return null;
  return Number(t);
}

function schrittWeite(spanne){
  const stufen = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000];
  return stufen.find(s => spanne / s <= 12) || 2000;
}

/* ---------- Zeichnen ---------- */

function zeichne(){
  const a = zustand.a, b = zustand.b;
  const spanne = b - a;
  const schritt = schrittWeite(spanne);
  const B = 1000, H = 210, rand = 52, achse = 140;
  const px = v => rand + (v - a) / spanne * (B - 2 * rand);
  const feineTeilung = spanne <= 70;
  zustand.masse = { a, b, B, rand, achse, px };

  let s = `<svg viewBox="0 0 ${B} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zahlengerade von ${a} bis ${b}">`;

  const nullX = (a <= 0 && b >= 0) ? px(0) : null;
  const bandOben = achse - 26, bandHoehe = 52;
  if(nullX !== null){
    if(a < 0) s += `<rect x="${px(a)}" y="${bandOben}" width="${nullX - px(a)}" height="${bandHoehe}" fill="var(--minus)" opacity="0.09"/>`;
    if(b > 0) s += `<rect x="${nullX}" y="${bandOben}" width="${px(b) - nullX}" height="${bandHoehe}" fill="var(--plus)" opacity="0.09"/>`;
  } else {
    const farbe = b < 0 ? "var(--minus)" : "var(--plus)";
    s += `<rect x="${px(a)}" y="${bandOben}" width="${px(b) - px(a)}" height="${bandHoehe}" fill="${farbe}" opacity="0.09"/>`;
  }

  if(feineTeilung){
    for(let v = Math.ceil(a); v <= b; v++){
      if(v % schritt === 0) continue;
      s += `<line x1="${px(v)}" y1="${achse - 6}" x2="${px(v)}" y2="${achse + 6}" stroke="var(--linie)" stroke-width="2"/>`;
    }
  }

  const ersterStrich = Math.ceil(a / schritt) * schritt;
  for(let v = ersterStrich; v <= b; v += schritt){
    const stark = v === 0;
    s += `<line x1="${px(v)}" y1="${achse - (stark ? 22 : 13)}" x2="${px(v)}" y2="${achse + (stark ? 22 : 13)}" stroke="var(--tinte)" stroke-width="${stark ? 5 : 3}"/>`;
    if(zustand.beschriftet){
      s += `<text x="${px(v)}" y="${achse + 46}" text-anchor="middle" font-size="21" font-weight="${stark ? 800 : 600}" fill="var(--tinte)" font-family="var(--schrift)">${v}</text>`;
    }
  }

  const links = a === 0 ? px(0) : rand - 26;
  s += `<line x1="${links}" y1="${achse}" x2="${B - rand + 26}" y2="${achse}" stroke="var(--tinte)" stroke-width="4"/>`;
  s += `<path d="M ${B - rand + 26} ${achse} l -16 -9 v 18 z" fill="var(--tinte)"/>`;
  if(a !== 0) s += `<path d="M ${rand - 26} ${achse} l 16 -9 v 18 z" fill="var(--tinte)"/>`;

  const sortiert = zustand.punkte.slice().sort((x, y) => x - y);
  let letzteX = -999, hoch = false;
  sortiert.forEach(v => {
    const x = px(v);
    hoch = (x - letzteX < 74) ? !hoch : false;
    letzteX = x;
    const y = achse - (hoch ? 84 : 46);
    const farbe = v < 0 ? "var(--minus)" : (v > 0 ? "var(--plus)" : "var(--tinte)");
    s += `<line x1="${x}" y1="${achse}" x2="${x}" y2="${y + 14}" stroke="${farbe}" stroke-width="2.5" stroke-dasharray="5 5"/>`;
    s += `<circle cx="${x}" cy="${achse}" r="10" fill="${farbe}"/>`;
    s += `<text x="${x}" y="${y + 2}" text-anchor="middle" font-size="27" font-weight="800" fill="${farbe}" font-family="var(--schrift)">${v}</text>`;
  });

  s += `</svg>`;
  el.gerade.innerHTML = s;
  el.gerade.querySelector("svg").addEventListener("click", tippAufGerade);
}

/* ---------- Punkte ---------- */

function setzePunkt(v){
  if(v < zustand.a || v > zustand.b){
    hinweis("Die Zahl " + v + " liegt außerhalb der Gerade.", "fehler");
    return;
  }
  const i = zustand.punkte.indexOf(v);
  if(i >= 0) zustand.punkte.splice(i, 1);
  else zustand.punkte.push(v);
  standardHinweis();
  zeichne();
}

function tippAufGerade(e){
  const m = zustand.masse;
  if(!m) return;
  const kasten = e.currentTarget.getBoundingClientRect();
  const xSvg = (e.clientX - kasten.left) / kasten.width * m.B;
  const wert = m.a + (xSvg - m.rand) / (m.B - 2 * m.rand) * (m.b - m.a);
  const gerundet = Math.round(wert);
  if(gerundet < m.a || gerundet > m.b) return;
  setzePunkt(gerundet);
}

/* ---------- Bedienung ---------- */

function uebernehmen(){
  const a = ganzeZahl(el.a.value), b = ganzeZahl(el.b.value);
  if(a === null || b === null){
    hinweis("Bitte zwei ganze Zahlen eintragen.", "fehler");
    return;
  }
  if(b - a < 2){
    hinweis("b muss mindestens 2 größer sein als a.", "fehler");
    return;
  }
  if(b - a > 5000){
    hinweis("Der Bereich ist zu groß, höchstens 5000 Schritte.", "fehler");
    return;
  }
  zustand.a = a; zustand.b = b;
  zustand.punkte = zustand.punkte.filter(v => v >= a && v <= b);
  standardHinweis();
  zeichne();
}

document.getElementById("zeichnen").addEventListener("click", uebernehmen);
[el.a, el.b].forEach(f => f.addEventListener("keydown", e => { if(e.key === "Enter") uebernehmen(); }));

document.getElementById("setzen").addEventListener("click", () => {
  const v = ganzeZahl(el.punkt.value);
  if(v === null){ hinweis("Bitte eine ganze Zahl eintragen.", "fehler"); return; }
  setzePunkt(v);
  el.punkt.value = "";
  el.punkt.focus();
});
el.punkt.addEventListener("keydown", e => { if(e.key === "Enter") document.getElementById("setzen").click(); });

el.beschriftung.addEventListener("click", () => {
  zustand.beschriftet = !zustand.beschriftet;
  el.beschriftung.textContent = zustand.beschriftet ? "Zahlen ausblenden" : "Zahlen einblenden";
  zeichne();
});

document.getElementById("leeren").addEventListener("click", () => {
  zustand.punkte = [];
  standardHinweis();
  zeichne();
});

document.getElementById("vollbild").addEventListener("click", () => {
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
});

zeichne();
</script>
</body>
</html>
