<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ganze Zahlen ordnen</title>
<style>
:root{
  --bg:#e9edf2;
  --papier:#ffffff;
  --tinte:#14213d;
  --tinte-hell:#5a6b85;
  --linie:#c3ccd8;
  --minus:#2f6f8f;
  --plus:#a2600d;
  --richtig:#1f7a4d;
  --falsch:#b3261e;
  --schrift: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--tinte);
  font-family:var(--schrift);
  min-height:100vh;
  padding:clamp(12px,2vw,28px);
}
.eyebrow{
  font-size:clamp(11px,1vw,13px);
  font-weight:700;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--tinte-hell);
  margin:0 0 10px;
}
header{
  display:flex;
  flex-wrap:wrap;
  align-items:baseline;
  gap:12px 20px;
  border-bottom:3px solid var(--tinte);
  padding-bottom:14px;
  margin-bottom:clamp(16px,2.5vw,30px);
}
h1{
  font-size:clamp(20px,2.6vw,32px);
  font-weight:800;
  letter-spacing:-.02em;
  margin:0;
}
.werkzeuge{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto;align-items:center}
button,select,input[type=text]{
  font-family:inherit;
  font-size:clamp(14px,1.2vw,16px);
  font-weight:600;
  color:var(--tinte);
  background:var(--papier);
  border:2px solid var(--tinte);
  border-radius:8px;
  padding:8px 14px;
  cursor:pointer;
}
input[type=text]{cursor:text;font-weight:500;min-width:190px}
button:hover,select:hover{background:#dfe5ee}
button:focus-visible,select:focus-visible,input:focus-visible,.karte:focus-visible,.platz:focus-visible{
  outline:3px solid var(--minus);
  outline-offset:2px;
}
button.stark{background:var(--tinte);color:#fff}
button.stark:hover{background:#25365a}
button:disabled{opacity:.4;cursor:default}

section{margin-bottom:clamp(16px,2.4vw,28px)}
.hinweis{font-size:clamp(13px,1.1vw,15px);color:var(--tinte-hell);margin:0 0 10px}

.vorrat{
  display:flex;flex-wrap:wrap;gap:clamp(8px,1.2vw,16px);
  min-height:clamp(78px,9vw,110px);
  align-items:center;
  padding:clamp(8px,1.2vw,14px);
  background:rgba(255,255,255,.45);
  border:2px dashed var(--linie);
  border-radius:14px;
  touch-action:none;
}
.vorrat.ziel{border-color:var(--minus);background:rgba(47,111,143,.10)}

.kette{display:flex;flex-wrap:wrap;gap:clamp(6px,1vw,14px);align-items:center}
.zeichen{
  font-size:clamp(30px,4.4vw,58px);
  font-weight:800;
  color:var(--tinte-hell);
  line-height:1;
  padding:0 2px;
}
.zeichen.ok{color:var(--richtig)}
.zeichen.fehler{color:var(--falsch)}

.karte,.platz{
  width:clamp(84px,9vw,132px);
  height:clamp(78px,8vw,116px);
  border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  touch-action:none;
}
.karte{
  background:var(--papier);
  border:3px solid var(--tinte);
  box-shadow:0 3px 0 var(--tinte);
  font-size:clamp(28px,3.6vw,46px);
  font-weight:800;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.03em;
  cursor:grab;
  user-select:none;
  transition:transform .12s ease, box-shadow .12s ease;
}
.karte:hover{transform:translateY(-2px);box-shadow:0 5px 0 var(--tinte)}
.karte.gewaehlt{border-color:var(--minus);box-shadow:0 0 0 4px rgba(47,111,143,.35),0 3px 0 var(--minus)}
.karte.zieht{opacity:.25}
.platz{
  border:3px dashed var(--linie);
  background:rgba(255,255,255,.35);
}
.platz.ziel{border-color:var(--minus);background:rgba(47,111,143,.12)}
.platz.voll{border:none;background:none;box-shadow:none}
.geist{
  position:fixed;z-index:99;pointer-events:none;
  transform:rotate(-3deg) scale(1.06);
  box-shadow:0 12px 24px rgba(20,33,61,.28);
}

.aktionen{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.rueckmeldung{
  font-size:clamp(15px,1.5vw,20px);
  font-weight:600;
  margin:14px 0 0;
  min-height:1.4em;
}
.rueckmeldung.ok{color:var(--richtig)}
.rueckmeldung.fehler{color:var(--falsch)}

.tafel{
  background:var(--papier);
  border:3px solid var(--tinte);
  border-radius:14px;
  padding:clamp(8px,1.4vw,18px);
}
.tafel svg{display:block;width:100%;height:auto}
.legende{
  display:flex;flex-wrap:wrap;gap:6px 22px;
  font-size:clamp(12px,1.1vw,14px);
  color:var(--tinte-hell);
  margin:10px 2px 0;
}
[hidden]{display:none !important}

@media (prefers-reduced-motion: reduce){
  .karte{transition:none}
}
</style>
</head>
<body>

<header>
  <div>
    <p class="eyebrow" id="zahlbereich">Klasse 7 · Ganze Zahlen</p>
    <h1>Ordne die Zahlen der Größe nach</h1>
  </div>
  <div class="werkzeuge">
    <select id="stufe" aria-label="Schwierigkeit">
      <option value="0">Stufe 0: natürliche Zahlen</option>
      <option value="1">Stufe 1: einstellig</option>
      <option value="2" selected>Stufe 2: zweistellig</option>
      <option value="3">Stufe 3: Stolperzahlen</option>
    </select>
    <button id="neu">Neue Aufgabe</button>
    <button id="richtung">Zeichen: &lt;</button>
    <input type="text" id="eigene" placeholder="Eigene Zahlen: -21, -12, 0, 5">
    <button id="uebernehmen">Übernehmen</button>
    <button id="vollbild">Vollbild</button>
  </div>
</header>

<section>
  <p class="eyebrow">Kartenvorrat</p>
  <p class="hinweis">Karte antippen, dann den Platz antippen. Ziehen geht auch.</p>
  <div class="vorrat" id="vorrat" data-ziel="vorrat"></div>
</section>

<section>
  <p class="eyebrow">Deine Kette</p>
  <div class="kette" id="kette"></div>
  <p class="rueckmeldung" id="rueckmeldung"></p>
</section>

<section class="aktionen">
  <button class="stark" id="zeigen">Zahlengerade zeigen</button>
  <button id="pruefen">Zeichen prüfen</button>
  <button id="leeren">Karten zurücklegen</button>
</section>

<section id="geradeBox" hidden>
  <p class="eyebrow">Zahlengerade</p>
  <div class="tafel">
    <div id="gerade"></div>
  </div>
  <div class="legende">
    <span>Die Zahl in der Fahne zeigt den Platz in deiner Kette.</span>
    <span>Links liegen die kleineren Zahlen.</span>
  </div>
</section>

<script>
const zustand = {
  zahlen: [],
  plaetze: [],
  vorrat: [],
  richtung: "<",
  geprueft: false,
  geradeSichtbar: false,
  gewaehlt: null
};

const el = {
  vorrat: document.getElementById("vorrat"),
  kette: document.getElementById("kette"),
  rueckmeldung: document.getElementById("rueckmeldung"),
  geradeBox: document.getElementById("geradeBox"),
  gerade: document.getElementById("gerade"),
  stufe: document.getElementById("stufe"),
  eigene: document.getElementById("eigene"),
  richtung: document.getElementById("richtung"),
  zeigen: document.getElementById("zeigen"),
  zahlbereich: document.getElementById("zahlbereich")
};

function nurNatuerlich(){
  return zustand.zahlen.length > 0 && Math.min(...zustand.zahlen) >= 0;
}

/* ---------- Aufgaben erzeugen ---------- */

function zufall(a, b){ return Math.floor(Math.random() * (b - a + 1)) + a; }

function mischen(liste){
  const k = liste.slice();
  for(let i = k.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [k[i], k[j]] = [k[j], k[i]];
  }
  return k;
}

function ziffernDreher(){
  let z = 0, d1 = 0, d2 = 0;
  do{
    z = zufall(12, 98); d1 = Math.floor(z / 10); d2 = z % 10;
  } while(d1 === d2 || d2 === 0);
  return { zahl: z, gedreht: d2 * 10 + d1 };
}

function neueAufgabe(stufe){
  const menge = new Set();
  if(stufe === "0"){
    const dreh = ziffernDreher();
    menge.add(dreh.zahl); menge.add(dreh.gedreht);
    menge.add(zufall(1, 9));
    while(menge.size < 5) menge.add(zufall(10, 99));
  } else if(stufe === "1"){
    while(menge.size < 4) menge.add(zufall(-9, 9));
  } else if(stufe === "2"){
    while(menge.size < 3) menge.add(zufall(-99, -10));
    menge.add(zufall(-9, 0));
    while(menge.size < 5) menge.add(zufall(1, 99));
  } else {
    const dreh = ziffernDreher();
    menge.add(-dreh.zahl); menge.add(-dreh.gedreht);
    const b = zufall(3, 9);
    menge.add(b); menge.add(-b * 10);
    menge.add(0);
  }
  return mischen([...menge]);
}

function setzeZahlen(zahlen){
  zustand.zahlen = zahlen;
  zustand.plaetze = new Array(zahlen.length).fill(null);
  zustand.vorrat = zahlen.map((_, i) => i);
  zustand.geprueft = false;
  zustand.gewaehlt = null;
  zustand.geradeSichtbar = false;
  el.geradeBox.hidden = true;
  el.zeigen.textContent = "Zahlengerade zeigen";
  el.zahlbereich.textContent = nurNatuerlich() ? "Klasse 7 · Natürliche Zahlen" : "Klasse 7 · Ganze Zahlen";
  meldung("", "");
  zeichnen();
}

/* ---------- Karten bewegen ---------- */

function ortVon(id){
  const p = zustand.plaetze.indexOf(id);
  if(p >= 0) return { art: "platz", index: p };
  return { art: "vorrat", index: zustand.vorrat.indexOf(id) };
}

function bewege(id, ziel){
  const her = ortVon(id);
  if(her.art === "platz") zustand.plaetze[her.index] = null;
  else zustand.vorrat.splice(her.index, 1);

  if(ziel.art === "platz"){
    const belegt = zustand.plaetze[ziel.index];
    if(belegt !== null && belegt !== undefined){
      if(her.art === "platz") zustand.plaetze[her.index] = belegt;
      else zustand.vorrat.splice(Math.max(her.index, 0), 0, belegt);
    }
    zustand.plaetze[ziel.index] = id;
  } else {
    zustand.vorrat.push(id);
  }
  zustand.geprueft = false;
  zustand.gewaehlt = null;
  meldung("", "");
  zeichnen();
}

/* ---------- Zeichnen ---------- */

function karteEl(id){
  const k = document.createElement("div");
  k.className = "karte";
  k.dataset.id = id;
  k.tabIndex = 0;
  k.textContent = zustand.zahlen[id];
  if(zustand.gewaehlt === id) k.classList.add("gewaehlt");
  k.addEventListener("pointerdown", starteZug);
  k.addEventListener("keydown", (e) => {
    if(e.key === "Enter" || e.key === " "){
      e.preventDefault();
      tippKarte(id);
    }
  });
  return k;
}

function zeichnen(){
  el.vorrat.innerHTML = "";
  zustand.vorrat.forEach(id => el.vorrat.appendChild(karteEl(id)));

  el.kette.innerHTML = "";
  zustand.plaetze.forEach((id, i) => {
    if(i > 0){
      const z = document.createElement("div");
      z.className = "zeichen";
      z.textContent = zustand.richtung;
      if(zustand.geprueft){
        const a = zustand.plaetze[i - 1], b = id;
        if(a !== null && b !== null){
          z.classList.add(stimmt(zustand.zahlen[a], zustand.zahlen[b]) ? "ok" : "fehler");
        }
      }
      el.kette.appendChild(z);
    }
    const platz = document.createElement("div");
    platz.className = "platz";
    platz.dataset.ziel = "platz";
    platz.dataset.index = i;
    platz.tabIndex = 0;
    platz.addEventListener("click", (e) => {
      if(e.target.closest(".karte")) return;
      tippPlatz(i);
    });
    platz.addEventListener("keydown", (e) => {
      if(e.key === "Enter" || e.key === " "){ e.preventDefault(); tippPlatz(i); }
    });
    if(id !== null){ platz.classList.add("voll"); platz.appendChild(karteEl(id)); }
    el.kette.appendChild(platz);
  });

  if(zustand.geradeSichtbar) zeichneGerade();
}

function stimmt(a, b){
  return zustand.richtung === "<" ? a < b : a > b;
}

function meldung(text, art){
  el.rueckmeldung.textContent = text;
  el.rueckmeldung.className = "rueckmeldung" + (art ? " " + art : "");
}

/* ---------- Tippen ---------- */

function tippKarte(id){
  if(zustand.gewaehlt !== null && zustand.gewaehlt !== id){
    const ziel = ortVon(id);
    if(ziel.art === "platz") bewege(zustand.gewaehlt, { art: "platz", index: ziel.index });
    else bewege(zustand.gewaehlt, { art: "vorrat" });
    return;
  }
  zustand.gewaehlt = (zustand.gewaehlt === id) ? null : id;
  zeichnen();
}

function tippPlatz(i){
  if(zustand.gewaehlt === null) return;
  bewege(zustand.gewaehlt, { art: "platz", index: i });
}

el.vorrat.addEventListener("click", (e) => {
  if(e.target.closest(".karte")) return;
  if(zustand.gewaehlt !== null) bewege(zustand.gewaehlt, { art: "vorrat" });
});

/* ---------- Ziehen ---------- */

let zug = null;

function starteZug(e){
  if(e.button !== undefined && e.button > 0) return;
  const karte = e.currentTarget;
  const kasten = karte.getBoundingClientRect();
  zug = {
    id: Number(karte.dataset.id),
    karte,
    startX: e.clientX,
    startY: e.clientY,
    dx: e.clientX - kasten.left,
    dy: e.clientY - kasten.top,
    breite: kasten.width,
    hoehe: kasten.height,
    bewegt: false,
    geist: null
  };
  window.addEventListener("pointermove", waehrendZug);
  window.addEventListener("pointerup", endeZug);
  window.addEventListener("pointercancel", endeZug);
}

function waehrendZug(e){
  if(!zug) return;
  const weit = Math.hypot(e.clientX - zug.startX, e.clientY - zug.startY);
  if(!zug.bewegt && weit > 6){
    zug.bewegt = true;
    const g = zug.karte.cloneNode(true);
    g.classList.add("geist");
    g.style.width = zug.breite + "px";
    g.style.height = zug.hoehe + "px";
    document.body.appendChild(g);
    zug.geist = g;
    zug.karte.classList.add("zieht");
  }
  if(zug.bewegt){
    zug.geist.style.left = (e.clientX - zug.dx) + "px";
    zug.geist.style.top = (e.clientY - zug.dy) + "px";
    markiereZiel(e.clientX, e.clientY);
  }
}

function markiereZiel(x, y){
  document.querySelectorAll(".ziel").forEach(n => n.classList.remove("ziel"));
  const treffer = zielUnter(x, y);
  if(treffer) treffer.classList.add("ziel");
}

function zielUnter(x, y){
  const knoten = document.elementFromPoint(x, y);
  return knoten ? knoten.closest("[data-ziel]") : null;
}

function endeZug(e){
  window.removeEventListener("pointermove", waehrendZug);
  window.removeEventListener("pointerup", endeZug);
  window.removeEventListener("pointercancel", endeZug);
  if(!zug) return;
  const aktuell = zug;
  zug = null;
  document.querySelectorAll(".ziel").forEach(n => n.classList.remove("ziel"));

  if(!aktuell.bewegt){
    tippKarte(aktuell.id);
    return;
  }
  if(aktuell.geist) aktuell.geist.remove();
  aktuell.karte.classList.remove("zieht");
  const treffer = zielUnter(e.clientX, e.clientY);
  if(!treffer){ zeichnen(); return; }
  if(treffer.dataset.ziel === "vorrat") bewege(aktuell.id, { art: "vorrat" });
  else bewege(aktuell.id, { art: "platz", index: Number(treffer.dataset.index) });
}

/* ---------- Zahlengerade ---------- */

function schrittWeite(spanne){
  const stufen = [1, 2, 5, 10, 20, 25, 50, 100, 200, 500];
  return stufen.find(s => spanne / s <= 12) || 1000;
}

function zeichneGerade(){
  const zahlen = zustand.zahlen;
  const natur = nurNatuerlich();
  let lo = natur ? 0 : Math.min(...zahlen, 0);
  let hi = Math.max(...zahlen, 0);
  const roh = Math.max(hi - lo, 2);
  const schritt = schrittWeite(roh);
  if(!natur) lo = Math.floor((lo - roh * 0.10) / schritt) * schritt;
  hi = Math.ceil((hi + roh * 0.10) / schritt) * schritt;

  const B = 1000, H = 230, links = 46, rechts = 46, achse = 168;
  const px = v => links + (v - lo) / (hi - lo) * (B - links - rechts);
  const feineTeilung = (hi - lo) <= 70;

  let s = `<svg viewBox="0 0 ${B} ${H}" role="img" aria-label="Zahlengerade mit den Zahlpunkten der Aufgabe">`;

  if(!natur){
    s += `<rect x="${px(lo)}" y="${achse - 26}" width="${Math.max(px(0) - px(lo), 0)}" height="52" fill="var(--minus)" opacity="0.07"/>`;
  }
  if(!natur){
    s += `<rect x="${px(0)}" y="${achse - 26}" width="${Math.max(px(hi) - px(0), 0)}" height="52" fill="var(--plus)" opacity="0.07"/>`;
  }

  if(feineTeilung){
    for(let v = lo; v <= hi; v++){
      if(v % schritt === 0) continue;
      s += `<line x1="${px(v)}" y1="${achse - 6}" x2="${px(v)}" y2="${achse + 6}" stroke="var(--linie)" stroke-width="2"/>`;
    }
  }

  for(let v = lo; v <= hi; v += schritt){
    const stark = v === 0;
    s += `<line x1="${px(v)}" y1="${achse - (stark ? 22 : 13)}" x2="${px(v)}" y2="${achse + (stark ? 22 : 13)}" stroke="var(--tinte)" stroke-width="${stark ? 5 : 3}"/>`;
    s += `<text x="${px(v)}" y="${achse + 46}" text-anchor="middle" font-size="21" font-weight="${stark ? 800 : 600}" fill="var(--tinte)" font-family="var(--schrift)">${v}</text>`;
  }

  const anfang = natur ? px(0) : links - 24;
  s += `<line x1="${anfang}" y1="${achse}" x2="${B - rechts + 24}" y2="${achse}" stroke="var(--tinte)" stroke-width="4"/>`;
  s += `<path d="M ${B - rechts + 24} ${achse} l -16 -9 v 18 z" fill="var(--tinte)"/>`;
  if(!natur) s += `<path d="M ${links - 24} ${achse} l 16 -9 v 18 z" fill="var(--tinte)"/>`;

  const punkte = zahlen.map((wert, id) => ({ wert, id, x: px(wert), platz: zustand.plaetze.indexOf(id) }))
                       .filter(p => p.platz >= 0)
                       .sort((a, b) => a.x - b.x);

  if(punkte.length === 0){
    s += `<text x="${B / 2}" y="${achse - 66}" text-anchor="middle" font-size="22" font-weight="600" fill="var(--tinte-hell)" font-family="var(--schrift)">Sobald eine Karte in der Kette liegt, erscheint ihr Zahlpunkt.</text>`;
  }

  let letzteX = -999, hoch = false;
  punkte.forEach(p => {
    hoch = (p.x - letzteX < 78) ? !hoch : false;
    letzteX = p.x;
    const y = achse - (hoch ? 86 : 44);
    const platz = p.platz;
    const farbe = p.wert < 0 ? "var(--minus)" : (p.wert > 0 && !natur ? "var(--plus)" : "var(--tinte)");

    s += `<line x1="${p.x}" y1="${achse}" x2="${p.x}" y2="${y + 14}" stroke="${farbe}" stroke-width="2.5" stroke-dasharray="5 5"/>`;
    s += `<circle cx="${p.x}" cy="${achse}" r="10" fill="${farbe}"/>`;
    s += `<text x="${p.x}" y="${y + 2}" text-anchor="middle" font-size="27" font-weight="800" fill="${farbe}" font-family="var(--schrift)">${p.wert}</text>`;

    if(platz >= 0){
      const fx = p.x + 22, fy = y - 24;
      s += `<circle cx="${fx}" cy="${fy}" r="15" fill="var(--papier)" stroke="${farbe}" stroke-width="3"/>`;
      s += `<text x="${fx}" y="${fy + 7}" text-anchor="middle" font-size="17" font-weight="800" fill="${farbe}" font-family="var(--schrift)">${platz + 1}</text>`;
    }
  });

  s += `</svg>`;
  el.gerade.innerHTML = s;
}

/* ---------- Prüfen ---------- */

function pruefen(){
  if(zustand.plaetze.some(p => p === null)){
    meldung("Es liegen noch nicht alle Karten in der Kette.", "fehler");
    return;
  }
  zustand.geprueft = true;
  const werte = zustand.plaetze.map(i => zustand.zahlen[i]);
  let fehler = 0;
  for(let k = 0; k < werte.length - 1; k++){
    if(!stimmt(werte[k], werte[k + 1])) fehler++;
  }
  zeichnen();
  if(fehler === 0){
    const richtungText = zustand.richtung === "<"
      ? "Von links nach rechts wird jede Zahl größer."
      : "Von links nach rechts wird jede Zahl kleiner.";
    meldung("Die Kette stimmt. " + richtungText, "ok");
  } else if(fehler === 1){
    meldung("Ein Zeichen stimmt nicht. Sieh dir die rote Stelle an der Zahlengeraden an.", "fehler");
  } else {
    meldung(fehler + " Zeichen stimmen nicht. Sieh dir die roten Stellen an der Zahlengeraden an.", "fehler");
  }
}

/* ---------- Bedienung ---------- */

document.getElementById("neu").addEventListener("click", () => {
  setzeZahlen(neueAufgabe(el.stufe.value));
});

el.stufe.addEventListener("change", () => {
  setzeZahlen(neueAufgabe(el.stufe.value));
});

el.richtung.addEventListener("click", () => {
  zustand.richtung = zustand.richtung === "<" ? ">" : "<";
  el.richtung.innerHTML = "Zeichen: " + (zustand.richtung === "<" ? "&lt;" : "&gt;");
  zustand.geprueft = false;
  meldung("", "");
  zeichnen();
});

document.getElementById("uebernehmen").addEventListener("click", () => {
  const roh = el.eigene.value.split(/[^\-\d]+/).filter(t => t !== "" && t !== "-");
  const zahlen = [...new Set(roh.map(Number).filter(Number.isInteger))].slice(0, 8);
  if(zahlen.length < 2){
    meldung("Bitte mindestens zwei ganze Zahlen eintragen, getrennt durch Komma.", "fehler");
    return;
  }
  setzeZahlen(mischen(zahlen));
});

el.eigene.addEventListener("keydown", (e) => {
  if(e.key === "Enter") document.getElementById("uebernehmen").click();
});

document.getElementById("zeigen").addEventListener("click", () => {
  zustand.geradeSichtbar = !zustand.geradeSichtbar;
  el.geradeBox.hidden = !zustand.geradeSichtbar;
  document.getElementById("zeigen").textContent = zustand.geradeSichtbar
    ? "Zahlengerade verstecken" : "Zahlengerade zeigen";
  if(zustand.geradeSichtbar) zeichneGerade();
});

document.getElementById("pruefen").addEventListener("click", pruefen);

document.getElementById("leeren").addEventListener("click", () => {
  setzeZahlen(zustand.zahlen.slice());
});

document.getElementById("vollbild").addEventListener("click", () => {
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
});

window.addEventListener("resize", () => {
  if(zustand.geradeSichtbar) zeichneGerade();
});

setzeZahlen(neueAufgabe(el.stufe.value));
</script>
</body>
</html>
